<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Poké‑Center</title>

    <!-- ==========================================
         STYLESHEET
         ========================================== -->
    ./css/styles.css
</head>

<body>

    <!-- ==========================================
         HOME PAGE
         ========================================== -->

    <!-- MAIN HEADER -->
    <div id="main-header">

        <div class="main-title">
            ./assets/logos/Poke_Center.png
            <h1 class="title">Poké‑Center</h1>
        </div>

        <button id="my-pokedex-button" class="pokedex-button">
            ./assets/logos/pokedex.png
            My Pokedex
        </button>

        <h2 class="subtitle">Select a Collection</h2>

    </div>

    <!-- COLLECTION SELECTOR -->
    <div id="collection-selector" class="collection-selector"></div>



    <!-- ==========================================
         COLLECTION OVERVIEW PAGE
         ========================================== -->

    <div id="collection-overview" class="collection-overview hidden">

        <!-- OVERVIEW HEADER -->
        <div class="overview-header">

            <div>
                <button id="overview-return-button"
                        class="return-button">

                    Return to Poké‑Center

                    ./assets/logos/Poke_Center.png
                </button>
            </div>

            <div>
                <button id="overview-pokedex-button"
                        class="pokedex-button">

                    My Pokedex

                    ./assets/logos/pokedex.png
                </button>
            </div>

        </div>

        <!-- OVERVIEW TITLE -->
        <h2 id="overview-title"
            class="overview-title"></h2>

        <!-- OVERVIEW LOGO -->
        <img id="overview-logo"
             class="overview-logo">

        <!-- OVERVIEW STATS -->
        <h2 id="overview-stats-title"
            class="subtitle"></h2>

        <div id="overview-progress"
             class="overview-progress">

            <p id="overview-total"></p>

            <!-- COMMON -->
            <div class="overview-rarity-row">

                <span class="rarity-icon"
                      id="rarity-common-icon"></span>

                <span class="rarity-label">
                    Common
                </span>

                <div class="rarity-bar">
                    <div id="rarity-common-fill"
                         class="rarity-fill"></div>
                </div>

                <span id="rarity-common-text"
                      class="rarity-text"></span>

            </div>

            <!-- UNCOMMON -->
            <div class="overview-rarity-row">

                <span class="rarity-icon"
                      id="rarity-uncommon-icon"></span>

                <span class="rarity-label">
                    Uncommon
                </span>

                <div class="rarity-bar">
                    <div id="rarity-uncommon-fill"
                         class="rarity-fill"></div>
                </div>

                <span id="rarity-uncommon-text"
                      class="rarity-text"></span>

            </div>

            <!-- RARE -->
            <div class="overview-rarity-row">

                <span class="rarity-icon"
                      id="rarity-rare-icon"></span>

                <span class="rarity-label">
                    Rare
                </span>

                <div class="rarity-bar">
                    <div id="rarity-rare-fill"
                         class="rarity-fill"></div>
                </div>

                <span id="rarity-rare-text"
                      class="rarity-text"></span>

            </div>

        </div>

        <!-- CATCH SECTION -->
        <h2 id="overview-catch-title"
            class="subtitle"></h2>

        <div class="catch-images">

            ./assets/logos/catch_open.png

        </div>

    </div>



    <!-- ==========================================
         CARD VIEWER PAGE
         ========================================== -->

    <div id="card-viewer"
         class="card-viewer hidden">

        <!-- VIEWER RETURN -->
        <button id="viewer-return-button"
                class="return-button">

            Return to Collection

        </button>

        <!-- COLLECTION TITLE -->
        <h2 id="collection-title"></h2>

        <!-- POKEDEX BUTTON -->
        <button id="viewer-pokedex-button"
                class="pokedex-button">

            ./assets/logos/pokedex.png

            My Pokedex

        </button>

        <!-- CARD GRID -->
        <div id="card-grid"
             class="card-grid"></div>

        <!-- RESET -->
        <button id="reset-pokedex-button"
                class="reset-button">

            Reset My Pokedex

        </button>

    </div>



    <!-- ==========================================
         MY POKEDEX PAGE
         ========================================== -->

    <div id="pokedex"
         class="pokedex hidden">

        <!-- POKEDEX RETURN -->
        <button id="pokedex-return-button"
                class="return-button">

            ./assets/logos/Poke_Center.png

            Return to Poké‑Center

        </button>

        <!-- POKEDEX TITLE -->
        <h2>My Pokedex</h2>

        <!-- POKEDEX GRID -->
        <div id="pokedex-grid"
             class="pokedex-grid"></div>

    </div>



    <!-- ==========================================
         CARD MODAL
         ========================================== -->

    <div id="card-modal"
         class="card-modal hidden">

        <div class="card-modal-content">

            <!-- CLOSE BUTTON -->
            <button id="modal-close"
                    class="modal-close-btn">

                ✖

            </button>

            <!-- CARD IMAGE -->
            <img id="modal-image">

            <!-- CARD NAME -->
            <h3 id="modal-name"></h3>

            <!-- MODAL RARITY -->
            <div id="modal-rarity"
                 class="rarity-row">

                <span id="modal-rarity-icon"></span>

                <span id="modal-rarity-text"></span>

            </div>

        </div>

    </div>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    ./js/poke-center.jsscript>

</body>
</html>
