<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Poké‑Center</title>
    <link rel="stylesheet"
          href="./css/styles.css">
</head>
<body>
    <!-- ==========================================
         HOME PAGE
         ========================================== -->
    <div id="main-header">
        <div class="main-title">
            <img
                src="./assets/logos/Poke_Center.png"
                alt="Poké‑Center"
                class="main-logo"
            >
            <h1 class="title">
                Poké‑Center
            </h1>
        </div>
        <button id="home-pokedex-button" class="pokedex-button">
            <img
                src="./assets/logos/pokedex.png"
                alt="Pokedex logo"
                class="pokedex-icon"
            >
            Pokédex
        </button>
        <!-- NEW: Wrapping scrolling components into their own layout layer -->
        <div id="home-scroll-layer">
            <h2 class="subtitle">
                Select a Collection
            </h2>
            <div id="collection-selector" class="collection-selector">
            </div>
        </div>
    </div>

    <!-- ==========================================
         COLLECTION OVERVIEW PAGE
         ========================================== -->
    <div id="collection-overview"
         class="collection-overview hidden">
        <div class="overview-header">
            <button id="overview-return-button"
                    class="return-button">
                <img
                    src="./assets/logos/Poke_Center.png"
                    alt="Home"
                    class="pc-icon-small"
                >
                Poké‑Center
            </button>
            <button id="overview-pokedex-button"
                    class="pokedex-button">
                <img
                    src="./assets/logos/pokedex.png"
                    alt="Pokédex logo"
                    class="pokedex-icon">
                Pokédex
            </button>
        </div>
        <img id="overview-logo"
             class="overview-logo"
             src=""
             alt="Collection Logo">
        <h2 id="overview-catch-title"
            class="subtitle overview-catch-title">
        </h2>
        <div class="catch-images">
            <img
                id="catch-open-image"
                src="./assets/logos/catchbutton.png"
                alt="Catch Pokémon"
                class="catch-image"
            >
        </div>
        <div id="overview-stats-title"
            class="subtitle overview-stats-title">
        </div>
        <div id="overview-progress"
             class="overview-progress">
            <p id="overview-total">
            </p>
            <div class="overview-rarity-row">
                <span class="rarity-icon"
                      id="rarity-common-icon">
                </span>
                <span class="rarity-label">
                    Common
                </span>
                <div class="rarity-bar">
                    <div id="rarity-common-fill"
                         class="rarity-fill">
                    </div>
                </div>
                <span id="rarity-common-text"
                      class="rarity-text">
                </span>
            </div>
            <div class="overview-rarity-row">
                <span class="rarity-icon"
                      id="rarity-uncommon-icon">
                </span>
                <span class="rarity-label">
                    Uncommon
                </span>
                <div class="rarity-bar">
                    <div id="rarity-uncommon-fill"
                         class="rarity-fill">
                    </div>
                </div>
                <span id="rarity-uncommon-text"
                      class="rarity-text">
                </span>
            </div>
            <div class="overview-rarity-row">
                <span class="rarity-icon"
                      id="rarity-rare-icon">
                </span>
                <span class="rarity-label">
                    Rare
                </span>
                <div class="rarity-bar">
                    <div id="rarity-rare-fill"
                         class="rarity-fill">
                    </div>
                </div>
                <span id="rarity-rare-text"
                      class="rarity-text">
                </span>
            </div>
        </div>
    </div>

   <!-- ==========================================
         CARD VIEWER PAGE
         ========================================== -->
    <div id="card-viewer" class="card-viewer hidden">
        <!-- FIXED SECTION ROW 1: Navigation Buttons (Locked) -->
        <div class="overview-header">
            <button id="viewer-home-return-button" class="return-button">
                <img src="./assets/logos/Poke_Center.png" alt="Home" class="pc-icon-small">
                Poké‑Center
            </button>
            <button id="viewer-pokedex-button" class="pokedex-button">
                <img src="./assets/logos/pokedex.png" alt="Pokédex" class="pokedex-icon">
                Pokédex
            </button>
        </div>	  
        
        <!-- FIXED SECTION ROW 2: Collection Logo Only (Locked) -->
        <div class="viewer-header-logo-group" style="margin-bottom: 0;">
            <button id="viewer-return-button" class="return-button">
               <img id="viewer-logo" src="" alt="Collection Logo" class="collection-icon-small">
            </button>
        </div>

        <!-- NEW CHASSIS START: Scroll layer opens here so subtitle scrolls up! -->
        <div id="viewer-scroll-layer">
            <div class="subtitle" style="margin-top: 10px; margin-bottom: 20px;">
                  Cards in the Collection
            </div>

            <div id="card-grid" class="card-grid" style="margin-top: 0;"></div>
            
            <button id="reset-pokedex-button" class="reset-button">
                Reset My Pokedex
            </button>
        </div>
    </div>



	    <!-- ==========================================
         MY POKEDEX PAGE
         ========================================== -->
    <div id="pokedex" class="pokedex hidden">
        <div class="overview-header">
            <button id="pokedex-return-button"
                    class="return-button">
                <img
                    src="./assets/logos/Poke_Center.png"
                    alt="Home"
                    class="pc-icon-small"
                >
                Poké‑Center
            </button>
            <button id="pokedex-header-indicator"
                    class="pokedex-button">
                <img
                    src="./assets/logos/pokedex.png"
                    alt="Pokedex logo"
                    class="pokedex-icon"
                >
                Pokédex
            </button>
        </div>
        
        <!-- NEW: Wrap the scrollable canvas layer here -->
        <div id="pokedex-scroll-layer">
            <div id="pokedex-grid" class="pokedex-grid"></div>
        </div>
        <button id="pokedex-view-button" class="hidden"></button>
    </div>


<!-- ==========================================
     CARD MODAL
     ========================================== -->
<div id="card-modal" class="card-modal hidden">
    <div class="card-modal-content">
        <div class="modal-close-bar">
            <button id="modal-close" class="modal-close-btn">✖</button>
        </div>
        
        <!-- Card Asset Body underneath -->
        <div class="modal-card-body">
            <img id="modal-image" src="" alt="Card Preview">
            <div class="modal-metadata">
               <!-- Row 1: Number and Name side-by-side -->
               <div class="modal-title-line">
                    <span id="modal-number"></span>
                    <span id="modal-name"></span>
               </div>
               <!-- Row 2: Rarity Icon and Rarity Text side-by-side -->
               <div class="modal-rarity-line">
                    <span id="modal-rarity-icon"></span>
                    <span id="modal-rarity-text"></span>
                </div>
             </div>
        </div>
    </div>
</div>

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->
    <script
        type="module"
        src="./js/poke-center.js"
    ></script>
</body>
</html>
