<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>30th Celebration Collection</title>

<script src="cardData.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:auto;
}

.card-container{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:10px;
  position:relative;
}

#pokemon-card,
#start-screen{
  max-width:100%;
  max-height:60vh;
  object-fit:contain;
  box-shadow:0 15px 50px rgba(0,0,0,.8);
}

#start-screen{
  cursor:pointer;
}

#card-info{
  margin-top:12px;
  text-align:center;
  display:none;
}

#card-name{
  font-size:1.4rem;
  font-weight:bold;
}

#card-number{
  margin-top:4px;
  color:#ccc;
}

#card-rarity{
  margin-top:6px;
  font-weight:bold;
}

#collection-status{
  margin-top:10px;
  font-weight:bold;
}

.button-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:12px;
}

.download-btn{
  padding:12px 20px;
  border-radius:25px;
  border:none;
  cursor:pointer;
  color:#fff;
  background:rgba(255,255,255,.15);
}

.loader{
  display:none;
}

.fade-in{
  animation:fadeIn .5s ease forwards;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* Binder */

#binder-screen{
  display:none;
  flex:1;
  overflow-y:auto;
  width:100%;
  padding:10px;
}

#binder-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
}

.binder-card{
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:6px;
  text-align:center;
  background:#111;
}

.binder-card img{
  width:100%;
  border-radius:6px;
}

.missing{
  filter:grayscale(100%);
  opacity:.45;
}

.small{
  font-size:.75rem;
}

#pdf-view-screen{
  display:none;
  width:100%;
  flex:1;
  flex-direction:column;
}

.pdf-frame{
  flex:1;
  width:100%;
}

.rarity-common{color:#b6b6b6;}
.rarity-rare{color:#ffffff;}
.rarity-double{color:#ffffff;}
.rarity-ir{color:#f6c343;}
.rarity-sir{color:#ffdf6b;}
.rarity-pika{color:#ffd400;}
.rarity-future{color:#59d7c4;}
.rarity-classic{color:#dddddd;}

.sparkle{
  position:absolute;
  pointer-events:none;
  z-index:99;
  animation:magicBurst 1.5s forwards;
}

@keyframes magicBurst{
  from{
    opacity:1;
    transform:translate(-50%,-50%);
  }
  to{
    opacity:0;
    transform:
      translate(-50%,-50%)
      translate(var(--dx),var(--dy))
      scale(0);
  }
}

</style>
</head>

<body>

<audio id="catch-sound"
       src="./catch.mp3"
       preload="auto"></audio>

<div id="card-wrapper" class="card-container">

<img id="start-screen"
  src="./30th_Celebration/Start_30th_Celebration.jpg"
  alt="Start Celebration Engine"
  onclick="drawRandomCard()">

  <div id="loading-status" class="loader">
    <h2>⚡ Catching...</h2>
  </div>

  <img id="pokemon-card"
       alt="Pokemon Card"
       style="display:none;">

  <div id="card-info">
      <div id="card-name"></div>
      <div id="card-number"></div>
      <div id="card-rarity"></div>
      <div id="collection-status"></div>
  </div>

</div>

<div id="binder-screen">

  <h2 style="text-align:center;">
      My Collection
  </h2>

  <div id="binder-summary"
       style="text-align:center;margin-bottom:15px;">
  </div>

  <div id="binder-grid"></div>

  <div class="button-row">
      <button class="download-btn"
              onclick="closeBinder()">
          ⬅ Back
      </button>
      <button class="download-btn"
              onclick="resetCollection()">
          Reset Collection
      </button>
  </div>
</div>

<div id="pdf-view-screen">

<iframe class="pdf-frame"
   src="./30th_Celebration/Card_List_30th_Celebration.pdf">
 </iframe>  

  <div class="button-row">
      <button class="download-btn"
              onclick="closePdfViewer()">
          ⬅ Back
      </button>
  </div>

</div>

<div id="footer-navigation"
     class="button-row">

  <button class="download-btn"
          onclick="viewCollection()">
      📚 My Collection
  </button>

  <button class="download-btn"
          onclick="openPdfViewer()">
      📄 Card List
  </button>

</div>

<script>

const TOTAL_CARDS = 196;
const FOLDER = "30th_Celebration";

function getCollection() {
    return JSON.parse(
        localStorage.getItem("pokemonCollection") || "[]"
    );
}

function saveCollection(collection){
    localStorage.setItem(
        "pokemonCollection",
        JSON.stringify(collection)
    );
}

function getRarityBadge(rarity){

    switch(rarity){

        case "Common":
            return "●";

        case "Rare":
            return "★";

        case "Double Rare":
            return "★★";

        case "Illustration Rare":
            return "⭐";

        case "Special Illustration Rare":
            return "⭐⭐";

        case "Pikachu Rare":
            return "❤";

        case "Futuristic Rare":
            return "✦";

        case "Classic Collection":
            return "★C";

        default:
            return "";
    }
}

function drawRandomCard(){

    let randomId =
        Math.floor(Math.random() * TOTAL_CARDS) + 1;

    let fileName =
        String(randomId)
          .padStart(4,'0') + ".png";

    let card =
        cardData[randomId];

    let collection =
        getCollection();

    let isNew =
        !collection.includes(randomId);

    if(isNew){
        collection.push(randomId);
        saveCollection(collection);
    }

    const cardImg =
      document.getElementById("pokemon-card");

    cardImg.style.display = "none";

    cardImg.src =
      "./"+FOLDER+"/"+fileName;

    document.getElementById(
      "loading-status"
    ).style.display = "block";

    cardImg.onload = function(){

cardImg.style.display="block";
cardImg.classList.remove("fade-in");
void cardImg.offsetWidth;
cardImg.classList.add("fade-in");

      document.getElementById(
        "loading-status"
      ).style.display = "none";

      document.getElementById(
        "start-screen"
      ).style.display="none";

      document.getElementById(
        "card-info"
      ).style.display="block";

      document.getElementById(
        "card-name"
      ).textContent =
        card.name;

      document.getElementById(
        "card-number"
      ).textContent =
        "Card #"+card.cardNumber;

      document.getElementById(
        "card-rarity"
      ).textContent =
        getRarityBadge(card.rarity)+
        " "+
        card.rarity;

      let total =
        collection.length;

      document.getElementById(
        "collection-status"
      ).innerHTML =
        (isNew
          ? "🎉 NEW CARD COLLECTED"
          : "✅ Already Collected")
        +"<br>"
        + total +" / "
        + TOTAL_CARDS
        +" Collected";

      launchHugeCelebration();

      let audio =
        document.getElementById(
            "catch-sound"
        );

      audio.currentTime=0;
      audio.play().catch(()=>{});
    };
}

function buildBinder(){

    const grid =
      document.getElementById("binder-grid");

    grid.innerHTML="";

    const collection =
      getCollection();

    for(let i=1;i<=TOTAL_CARDS;i++){

        const card =
          cardData[i];

        const owned =
          collection.includes(i);

        const file =
          String(i)
          .padStart(4,"0")
          + ".png";

        const div =
          document.createElement("div");

        div.className =
          "binder-card";

        div.innerHTML=`
          <img
          class="${owned ? "" : "missing"}"
          src="./${FOLDER}/${file}">
          <div class="small">
            #${card.cardNumber}
          </div>
          <div class="small">
            ${card.name}
          </div>
          <div class="small">
            ${getRarityBadge(card.rarity)}
          </div>
        `;

        grid.appendChild(div);
    }

    document.getElementById(
      "binder-summary"
    ).innerHTML =
      `${collection.length} / ${TOTAL_CARDS}
      Collected (${(
      collection.length/TOTAL_CARDS*100
      ).toFixed(1)}%)`;
}

function viewCollection(){

    buildBinder();

    document.getElementById(
      "card-wrapper"
    ).style.display="none";

    document.getElementById(
      "footer-navigation"
    ).style.display="none";

    document.getElementById(
      "binder-screen"
    ).style.display="block";
}

function closeBinder(){

    document.getElementById(
      "binder-screen"
    ).style.display="none";

    document.getElementById(
      "card-wrapper"
    ).style.display="flex";

    document.getElementById(
      "footer-navigation"
    ).style.display="flex";
}

function resetCollection(){

    if(
      confirm(
        "Reset your entire collection?"
      )
    ){
        localStorage.removeItem(
            "pokemonCollection"
        );

        buildBinder();
    }
}

function openPdfViewer(){

    document.getElementById(
      "card-wrapper"
    ).style.display="none";

    document.getElementById(
      "footer-navigation"
    ).style.display="none";

    document.getElementById(
      "pdf-view-screen"
    ).style.display="flex";
}

function closePdfViewer(){

    document.getElementById(
      "pdf-view-screen"
    ).style.display="none";

    document.getElementById(
      "card-wrapper"
    ).style.display="flex";

    document.getElementById(
      "footer-navigation"
    ).style.display="flex";
}
function launchHugeCelebration(){
    const container =
      document.getElementById(
        "card-wrapper"
      );
    for(let i=0;i<40;i++){
        const s =
          document.createElement("div");
        s.className="sparkle";
        s.style.background =
          ["#ffd700",
           "#00f0ff",
           "#ff007f",
           "#ffffff"]
           [Math.floor(Math.random()*4)];
        s.style.width="10px";
        s.style.height="10px";
        s.style.borderRadius="50%";
        s.style.left="50%";
        s.style.top="50%";
        s.style.setProperty(
          "--dx",
          (Math.random()*400-200)+"px"
        );
        s.style.setProperty(
          "--dy",
          (Math.random()*400-200)+"px"
        );
        container.appendChild(s);
        setTimeout(()=>{
            s.remove();
        },1500);
    }
}
</script>
</body>
</html>
